openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Recipe Coster API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ingredients
    description: Ingredient/product management
  - name: recipes
    description: Recipe management
  - name: openai
    description: AI-assisted generation
  - name: Auth
    description: Credential and Google OAuth authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ingredients:
    get:
      operationId: listIngredients
      tags: [ingredients]
      summary: List all ingredients
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search term to filter ingredients by name or category
        - name: supplier
          in: query
          schema:
            type: string
          description: Filter by supplier name (e.g. "Woolworths", "Coles")
      responses:
        "200":
          description: List of ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ingredient"
    post:
      operationId: createIngredient
      tags: [ingredients]
      summary: Create a new ingredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIngredientBody"
      responses:
        "201":
          description: Created ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"

  /ingredients/{id}:
    get:
      operationId: getIngredient
      tags: [ingredients]
      summary: Get ingredient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateIngredient
      tags: [ingredients]
      summary: Update an ingredient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIngredientBody"
      responses:
        "200":
          description: Updated ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteIngredient
      tags: [ingredients]
      summary: Delete an ingredient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /recipes:
    get:
      operationId: listRecipes
      tags: [recipes]
      summary: List all recipes
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by title or description
        - name: tag
          in: query
          schema:
            type: string
          description: Filter by tag
      responses:
        "200":
          description: List of recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeSummary"
    post:
      operationId: createRecipe
      tags: [recipes]
      summary: Create a new recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipeBody"
      responses:
        "201":
          description: Created recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"

  /recipes/{id}:
    get:
      operationId: getRecipe
      tags: [recipes]
      summary: Get recipe by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateRecipe
      tags: [recipes]
      summary: Update a recipe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecipeBody"
      responses:
        "200":
          description: Updated recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRecipe
      tags: [recipes]
      summary: Delete a recipe
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /recipes/stats/summary:
    get:
      operationId: getRecipeStats
      tags: [recipes]
      summary: Get recipe statistics summary
      responses:
        "200":
          description: Recipe stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeStats"

  /openai/generate-recipe:
    post:
      operationId: generateRecipe
      tags: [openai]
      summary: Generate a recipe using AI
      description: Given selected ingredients, dietary tags and a prompt, produce a draft recipe (title, description, method).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRecipeRequest"
      responses:
        "200":
          description: Generated recipe draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateRecipeResponse"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"

  /auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: Create a new credential-backed user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupBody"
      responses:
        "201":
          description: Account created and a session cookie was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          description: Validation error or password policy failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: An account with that email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Authenticated; a session cookie was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/set-password:
    post:
      tags: [Auth]
      operationId: setPassword
      summary: Set the initial password for an invited employee
      description: |
        First-login / invite flow for users that were created from the
        business fixture (e.g. payroll import) and have no password
        yet. Looks up the user by `linkingId` and sets `passwordHash`
        if-and-only-if the row currently has no password set. Refuses
        to overwrite an existing password (use a separate password
        reset flow for that). On success a session cookie is issued so
        the user is logged in immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordBody"
      responses:
        "200":
          description: Password set; a session cookie was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "400":
          description: Validation error or password policy failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No user matches the supplied linkingId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The user already has a password set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out and clear the session cookie
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: The session was cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"

  /auth/google:
    get:
      tags: [Auth]
      operationId: beginGoogleLogin
      summary: Begin the Google OIDC sign-in flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after sign-in (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to Google's authorization endpoint.
        "503":
          description: Google sign-in is not configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/google/callback:
    get:
      tags: [Auth]
      operationId: handleGoogleLoginCallback
      summary: Complete the Google OIDC sign-in flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the post-login `returnTo` path on success or to `/` on failure.
        "503":
          description: Google sign-in is not configured on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /auth/google/available:
    get:
      tags: [Auth]
      operationId: getGoogleAuthAvailability
      summary: Returns whether Google sign-in is enabled on this server
      responses:
        "200":
          description: Availability flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleAuthAvailability"

components:
  parameters:
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Ingredient:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        supplier:
          type: ["string", "null"]
        purchaseUnit:
          type: string
          description: "The unit the ingredient is purchased in (e.g. kg, L, each)"
        purchaseUnitSize:
          type: number
          description: "The size of the purchase unit (e.g. 1 for 1kg, 5 for 5L)"
        purchaseCost:
          type: number
          description: "Cost of one purchase unit in dollars"
        recipeUnit:
          type: string
          description: "The unit used in recipes (e.g. g, ml, each)"
        recipeUnitCost:
          type: number
          description: "Cost per recipe unit (auto-calculated)"
        category:
          type: ["string", "null"]
        imageKey:
          type: ["string", "null"]
          description: "Stored object key for the ingredient photo (provider-agnostic)."
        imageUrl:
          type: ["string", "null"]
          description: "Time-limited URL for fetching the photo. Re-fetch the ingredient when it expires."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - purchaseUnit
        - purchaseUnitSize
        - purchaseCost
        - recipeUnit
        - recipeUnitCost
        - createdAt
        - updatedAt

    CreateIngredientBody:
      type: object
      properties:
        name:
          type: string
        supplier:
          type: ["string", "null"]
        purchaseUnit:
          type: string
        purchaseUnitSize:
          type: number
        purchaseCost:
          type: number
        recipeUnit:
          type: string
        category:
          type: ["string", "null"]
      required:
        - name
        - purchaseUnit
        - purchaseUnitSize
        - purchaseCost
        - recipeUnit

    UpdateIngredientBody:
      type: object
      properties:
        name:
          type: string
        supplier:
          type: ["string", "null"]
        purchaseUnit:
          type: string
        purchaseUnitSize:
          type: number
        purchaseCost:
          type: number
        recipeUnit:
          type: string
        category:
          type: ["string", "null"]

    RecipeIngredient:
      type: object
      properties:
        ingredientId:
          type: integer
        ingredientName:
          type: string
        quantity:
          type: number
        unit:
          type: string
        purchaseCost:
          type: number
        purchaseUnit:
          type: string
        purchaseUnitSize:
          type: number
        recipeUnit:
          type: string
        recipeUnitCost:
          type: number
        lineCost:
          type: number
      required:
        - ingredientId
        - ingredientName
        - quantity
        - unit
        - purchaseCost
        - purchaseUnit
        - purchaseUnitSize
        - recipeUnit
        - recipeUnitCost
        - lineCost

    RecipeIngredientInput:
      type: object
      properties:
        ingredientId:
          type: integer
        quantity:
          type: number
        unit:
          type: string
      required:
        - ingredientId
        - quantity
        - unit

    MethodBlock:
      type: object
      properties:
        type:
          type: string
          enum: [header, numbered, text, subinstruction]
        content:
          type: string
        order:
          type: integer
      required:
        - type
        - content
        - order

    RecipeCostSummary:
      type: object
      properties:
        totalIngredientCost:
          type: number
        servings:
          type: integer
        costPerPortion:
          type: number
        wastageCost:
          type: number
        wastagePercent:
          type: number
        totalCostWithWastage:
          type: number
        costPerPortionWithWastage:
          type: number
        foodCostPercent:
          type: number
        recommendedSalePrice:
          type: number
      required:
        - totalIngredientCost
        - servings
        - costPerPortion
        - wastageCost
        - wastagePercent
        - totalCostWithWastage
        - costPerPortionWithWastage
        - foodCostPercent
        - recommendedSalePrice

    Recipe:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        servings:
          type: integer
        wastagePercent:
          type: number
        foodCostPercent:
          type: number
        tags:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
        method:
          type: array
          items:
            $ref: "#/components/schemas/MethodBlock"
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecipeIngredient"
        costSummary:
          $ref: "#/components/schemas/RecipeCostSummary"
        authorName:
          type: ["string", "null"]
        imageKey:
          type: ["string", "null"]
          description: "Stored object key for the recipe hero photo (provider-agnostic)."
        imageUrl:
          type: ["string", "null"]
          description: "Time-limited URL for fetching the photo. Re-fetch the recipe when it expires."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - servings
        - wastagePercent
        - foodCostPercent
        - tags
        - allergens
        - method
        - ingredients
        - costSummary
        - createdAt
        - updatedAt

    RecipeSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        servings:
          type: integer
        tags:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
        ingredientNames:
          type: array
          items:
            type: string
        costPerPortion:
          type: number
        recommendedSalePrice:
          type: number
        imageKey:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - servings
        - tags
        - allergens
        - ingredientNames
        - costPerPortion
        - recommendedSalePrice
        - createdAt
        - updatedAt

    CreateRecipeBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        servings:
          type: integer
        wastagePercent:
          type: number
        foodCostPercent:
          type: number
        tags:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
        method:
          type: array
          items:
            $ref: "#/components/schemas/MethodBlock"
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecipeIngredientInput"
        authorName:
          type: ["string", "null"]
      required:
        - title
        - servings
        - wastagePercent
        - foodCostPercent
        - tags
        - allergens
        - method
        - ingredients

    UpdateRecipeBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        servings:
          type: integer
        wastagePercent:
          type: number
        foodCostPercent:
          type: number
        tags:
          type: array
          items:
            type: string
        allergens:
          type: array
          items:
            type: string
        method:
          type: array
          items:
            $ref: "#/components/schemas/MethodBlock"
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecipeIngredientInput"
        authorName:
          type: ["string", "null"]

    RecipeStats:
      type: object
      properties:
        totalRecipes:
          type: integer
        totalIngredients:
          type: integer
        avgCostPerPortion:
          type: number
        avgRecommendedSalePrice:
          type: number
        recentRecipes:
          type: array
          items:
            $ref: "#/components/schemas/RecipeSummary"
      required:
        - totalRecipes
        - totalIngredients
        - avgCostPerPortion
        - avgRecommendedSalePrice
        - recentRecipes

    GenerateRecipeRequest:
      type: object
      properties:
        prompt:
          type: string
          maxLength: 1000
        servings:
          type: integer
          minimum: 1
          maximum: 1000
        dietaryTags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        ingredients:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/GenerateRecipeIngredient"
      required:
        - prompt
        - servings
        - ingredients
        - dietaryTags

    GenerateRecipeIngredient:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        quantity:
          type: number
          exclusiveMinimum: true
          maximum: 100000
        unit:
          type: string
          maxLength: 50
      required:
        - name
        - quantity
        - unit

    GenerateRecipeResponse:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        method:
          type: array
          items:
            $ref: "#/components/schemas/MethodBlock"
      required:
        - title
        - description
        - method

    AuthUser:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - preferredName
        - profileImageUrl
        - linkingId
        - payrollId
        - companyId
        - companyName
        - venueId
        - venueName
        - workAreaId
        - workAreaName
        - roleId
        - roleName
        - permissions
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        preferredName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
        linkingId:
          type: [string, "null"]
          description: Internal employee linking id (e.g. EMP-2976-3087-308720).
        payrollId:
          type: [string, "null"]
          description: Payroll system identifier (e.g. DV-308720).
        companyId:
          type: [string, "null"]
        companyName:
          type: [string, "null"]
        venueId:
          type: [string, "null"]
        venueName:
          type: [string, "null"]
        workAreaId:
          type: [string, "null"]
        workAreaName:
          type: [string, "null"]
        roleId:
          type: [string, "null"]
        roleName:
          type: [string, "null"]
        permissions:
          type: array
          items:
            type: string
            enum: [admin, executive, venue_manager, supervisor, staff, viewer]

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"

    SignupBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: |
            Must be at least 12 characters and contain an upper-case letter,
            lower-case letter, digit and special character.
        firstName:
          type: [string, "null"]
          maxLength: 100
        lastName:
          type: [string, "null"]
          maxLength: 100

    SetPasswordBody:
      type: object
      required: [linkingId, password]
      properties:
        linkingId:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            The employee's `linking_id` from the business fixture
            (e.g. `EMP-2976-3087-308720`). Used to locate the user
            row to attach the password to.
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: |
            Must be at least 12 characters and contain an upper-case letter,
            lower-case letter, digit and special character.

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 256

    AuthSuccessResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"

    GoogleAuthAvailability:
      type: object
      required: [available]
      properties:
        available:
          type: boolean

    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true

