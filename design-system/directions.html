<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Le Répertoire — Two Directions</title>
    <link rel="stylesheet" href="tokens/colors.css" />
    <link rel="stylesheet" href="tokens/typography.css" />
    <link rel="stylesheet" href="tokens/spacing.css" />
    <link rel="stylesheet" href="tokens/components.css" />

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <style>
      body {
        margin: 0;
        background: #1a1f27;
      }

      /* =========================================================
     DIRECTION 1 — "Maison" · editorial calm, warm forest+copper
     ========================================================= */
      .dir-maison {
        --m-bg: #f5f1ea;
        --m-canvas: #fbf8f2;
        --m-surface: #ffffff;
        --m-ink: #1c2820;
        --m-ink-2: #4a5851;
        --m-ink-3: #8a948e;
        --m-rule: #e6dfd1;
        --m-accent: #1f4332; /* deep forest */
        --m-accent-2: #b56c3a; /* copper */
        --m-soft: #ecefe8;
        --m-warn: #b58320;

        background: var(--m-bg);
        color: var(--m-ink);
        font-family: var(--font-body);
        height: 100%;
      }
      .dir-maison .m-shell {
        display: grid;
        grid-template-columns: 240px 1fr;
        height: 100%;
      }
      .dir-maison .m-side {
        background: var(--m-canvas);
        border-right: 1px solid var(--m-rule);
        padding: 28px 22px;
        display: flex;
        flex-direction: column;
      }
      .dir-maison .m-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
      }
      .dir-maison .m-mark {
        width: 32px;
        height: 32px;
        border-radius: 4px;
        background: var(--m-accent);
        color: #f5f1ea;
        display: grid;
        place-items: center;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 18px;
      }
      .dir-maison .m-wordmark {
        font-family: var(--font-display);
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .dir-maison .m-wordmark em {
        font-style: italic;
        color: var(--m-accent-2);
        font-weight: 500;
      }
      .dir-maison .m-side h6 {
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 400;
        font-size: 13px;
        color: var(--m-ink-3);
        margin: 24px 0 10px;
        letter-spacing: 0;
      }
      .dir-maison .m-nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .dir-maison .m-nav a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 12px;
        border-radius: 6px;
        font-size: 14px;
        color: var(--m-ink-2);
        text-decoration: none;
        border-left: 2px solid transparent;
        padding-left: 10px;
        transition: all 120ms ease;
      }
      .dir-maison .m-nav a:hover {
        background: var(--m-soft);
        color: var(--m-ink);
      }
      .dir-maison .m-nav a.active {
        color: var(--m-ink);
        font-weight: 500;
        border-left-color: var(--m-accent-2);
        background: transparent;
      }
      .dir-maison .m-nav .ct {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--m-ink-3);
      }

      .dir-maison .m-main {
        padding: 0;
        overflow: auto;
      }
      .dir-maison .m-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 48px;
        border-bottom: 1px solid var(--m-rule);
        background: var(--m-bg);
      }
      .dir-maison .m-topbar .crumbs {
        font-size: 13px;
        color: var(--m-ink-3);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dir-maison .m-topbar .crumbs strong {
        color: var(--m-ink);
        font-weight: 500;
      }
      .dir-maison .m-topbar .actions {
        display: flex;
        gap: 10px;
      }
      .dir-maison .m-btn {
        height: 36px;
        padding: 0 16px;
        border-radius: 4px;
        border: 1px solid var(--m-rule);
        background: var(--m-surface);
        color: var(--m-ink);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
      }
      .dir-maison .m-btn--primary {
        background: var(--m-accent);
        color: #f5f1ea;
        border-color: var(--m-accent);
      }
      .dir-maison .m-btn--ghost {
        background: transparent;
        border-color: transparent;
      }

      .dir-maison .m-hero {
        padding: 56px 48px 36px;
        border-bottom: 1px solid var(--m-rule);
      }
      .dir-maison .m-hero .greet-eyebrow {
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 400;
        color: var(--m-accent-2);
        font-size: 15px;
        margin-bottom: 12px;
      }
      .dir-maison .m-hero h1 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 56px;
        line-height: 1.05;
        letter-spacing: -0.025em;
        margin: 0 0 18px;
        max-width: 22ch;
      }
      .dir-maison .m-hero h1 em {
        font-style: italic;
        color: var(--m-accent-2);
        font-weight: 500;
      }
      .dir-maison .m-hero p {
        color: var(--m-ink-2);
        font-size: 16px;
        max-width: 56ch;
        margin: 0;
        line-height: 1.6;
      }

      .dir-maison .m-grid {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 0;
        padding: 0 48px;
      }
      .dir-maison .m-col {
        padding: 36px 0 36px;
      }
      .dir-maison .m-col + .m-col {
        border-left: 1px solid var(--m-rule);
        padding-left: 36px;
      }
      .dir-maison .m-col:first-child {
        padding-right: 36px;
      }

      .dir-maison .m-section-title {
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 400;
        font-size: 18px;
        color: var(--m-ink-2);
        margin: 0 0 18px;
      }

      .dir-maison .m-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        border-top: 1px solid var(--m-rule);
      }
      .dir-maison .m-stat {
        padding: 18px 0;
        border-bottom: 1px solid var(--m-rule);
      }
      .dir-maison .m-stat + .m-stat {
        border-left: 1px solid var(--m-rule);
        padding-left: 22px;
      }
      .dir-maison .m-stat:nth-child(odd) {
        padding-right: 22px;
      }
      .dir-maison .m-stat .label {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--m-ink-3);
      }
      .dir-maison .m-stat .v {
        font-family: var(--font-display);
        font-size: 36px;
        font-weight: 500;
        letter-spacing: -0.02em;
        margin-top: 6px;
      }
      .dir-maison .m-stat .d {
        font-size: 12px;
        color: var(--m-ink-3);
        margin-top: 2px;
        font-style: italic;
        font-family: var(--font-display);
      }

      .dir-maison .m-roster .row {
        display: grid;
        grid-template-columns: 32px 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid var(--m-rule);
      }
      .dir-maison .m-roster .row:last-child {
        border-bottom: none;
      }
      .dir-maison .m-roster .num {
        font-family: var(--font-display);
        font-size: 14px;
        color: var(--m-ink-3);
        font-style: italic;
      }
      .dir-maison .m-roster .nm {
        font-size: 14px;
        font-weight: 500;
      }
      .dir-maison .m-roster .role {
        font-size: 12px;
        color: var(--m-ink-3);
        margin-top: 2px;
      }
      .dir-maison .m-roster .time {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--m-ink-2);
      }

      .dir-maison .m-maestro {
        background: var(--m-canvas);
        border: 1px solid var(--m-rule);
        border-radius: 4px;
        padding: 24px;
        position: relative;
      }
      .dir-maison .m-maestro::before {
        content: "";
        position: absolute;
        left: -1px;
        top: 18px;
        bottom: 18px;
        width: 2px;
        background: var(--m-accent-2);
      }
      .dir-maison .m-maestro .eyebrow {
        font-family: var(--font-display);
        font-style: italic;
        color: var(--m-accent-2);
        font-size: 13px;
        margin-bottom: 10px;
      }
      .dir-maison .m-maestro h3 {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: -0.01em;
        margin: 0 0 12px;
      }
      .dir-maison .m-maestro p {
        font-size: 14px;
        color: var(--m-ink-2);
        line-height: 1.55;
        margin: 0 0 18px;
      }
      .dir-maison .m-maestro .acts {
        display: flex;
        gap: 8px;
      }

      /* =========================================================
     DIRECTION 2 — "Atelier" · operational dense, ink + lime
     ========================================================= */
      .dir-atelier {
        --a-bg: #0c1014;
        --a-canvas: #11161d;
        --a-surface: #161c25;
        --a-surface-2: #1c232d;
        --a-rule: #232b37;
        --a-rule-2: #2e3641;
        --a-ink: #ecf0f5;
        --a-ink-2: #9aa4b1;
        --a-ink-3: #5d6675;
        --a-accent: #c4f25a; /* signal lime */
        --a-accent-ink: #0c1014;
        --a-blue: #5b9bf2;
        --a-warn: #f2b94d;
        --a-bad: #ef6f6f;
        --a-good: #6ed79a;

        background: var(--a-bg);
        color: var(--a-ink);
        font-family:
          "Geist",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        height: 100%;
        font-feature-settings: "ss01", "cv11", "tnum";
      }
      .dir-atelier .a-shell {
        display: grid;
        grid-template-columns: 56px 1fr;
        height: 100%;
      }
      .dir-atelier .a-rail {
        background: var(--a-canvas);
        border-right: 1px solid var(--a-rule);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 14px 0;
        gap: 6px;
      }
      .dir-atelier .a-rail .a-mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--a-accent);
        color: var(--a-accent-ink);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.04em;
        margin-bottom: 12px;
      }
      .dir-atelier .a-rail button {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: transparent;
        border: none;
        color: var(--a-ink-2);
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: all 120ms ease;
      }
      .dir-atelier .a-rail button:hover {
        background: var(--a-surface);
        color: var(--a-ink);
      }
      .dir-atelier .a-rail button.active {
        background: var(--a-surface-2);
        color: var(--a-accent);
        position: relative;
      }
      .dir-atelier .a-rail button.active::before {
        content: "";
        position: absolute;
        left: -10px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--a-accent);
        border-radius: 2px;
      }
      .dir-atelier .a-rail .spacer {
        flex: 1;
      }

      .dir-atelier .a-main {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
      }
      .dir-atelier .a-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--a-rule);
        background: var(--a-canvas);
      }
      .dir-atelier .a-top .left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .dir-atelier .a-top .crumb {
        font-size: 13px;
        color: var(--a-ink-2);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .dir-atelier .a-top .crumb strong {
        color: var(--a-ink);
        font-weight: 500;
      }
      .dir-atelier .a-top .pill {
        height: 26px;
        padding: 0 10px;
        background: var(--a-surface);
        border: 1px solid var(--a-rule);
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--a-ink-2);
      }
      .dir-atelier .a-top .pill .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--a-good);
        box-shadow: 0 0 8px var(--a-good);
      }

      .dir-atelier .a-top .right {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .dir-atelier .a-btn {
        height: 30px;
        padding: 0 12px;
        border-radius: 6px;
        border: 1px solid var(--a-rule);
        background: var(--a-surface);
        color: var(--a-ink);
        font: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      .dir-atelier .a-btn--primary {
        background: var(--a-accent);
        color: var(--a-accent-ink);
        border-color: var(--a-accent);
      }
      .dir-atelier .a-btn--ghost {
        background: transparent;
        border-color: transparent;
        color: var(--a-ink-2);
      }

      .dir-atelier .a-page {
        padding: 16px 20px 24px;
        overflow: auto;
        display: grid;
        gap: 14px;
        grid-template-rows: auto auto 1fr;
      }

      .dir-atelier .a-kpis {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 1px;
        background: var(--a-rule);
        border: 1px solid var(--a-rule);
        border-radius: 8px;
        overflow: hidden;
      }
      .dir-atelier .a-kpi {
        background: var(--a-canvas);
        padding: 12px 14px;
        display: grid;
        gap: 4px;
        align-content: start;
      }
      .dir-atelier .a-kpi .lbl {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--a-ink-3);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dir-atelier .a-kpi .v {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--a-ink);
      }
      .dir-atelier .a-kpi .v small {
        font-size: 12px;
        font-weight: 500;
        color: var(--a-ink-3);
        margin-left: 4px;
      }
      .dir-atelier .a-kpi .d {
        font-size: 11px;
        color: var(--a-ink-2);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .dir-atelier .a-kpi .d.up {
        color: var(--a-good);
      }
      .dir-atelier .a-kpi .d.down {
        color: var(--a-bad);
      }

      .dir-atelier .a-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--a-canvas);
        border: 1px solid var(--a-rule);
        border-radius: 8px;
        padding: 8px 10px;
        gap: 8px;
        flex-wrap: wrap;
      }
      .dir-atelier .a-bar .group {
        display: inline-flex;
        gap: 4px;
        padding: 3px;
        background: var(--a-surface-2);
        border-radius: 6px;
      }
      .dir-atelier .a-bar .group button {
        background: transparent;
        border: 0;
        padding: 5px 10px;
        border-radius: 4px;
        font: inherit;
        font-size: 11px;
        color: var(--a-ink-2);
        cursor: pointer;
      }
      .dir-atelier .a-bar .group button.on {
        background: var(--a-canvas);
        color: var(--a-ink);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
      }
      .dir-atelier .a-bar .search {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        height: 28px;
        border: 1px solid var(--a-rule);
        border-radius: 6px;
        background: var(--a-surface);
        color: var(--a-ink-3);
        font-size: 12px;
        flex: 1;
        max-width: 280px;
      }
      .dir-atelier .a-bar .search input {
        background: transparent;
        border: 0;
        outline: none;
        color: var(--a-ink);
        font: inherit;
        flex: 1;
      }
      .dir-atelier .a-bar .kbd {
        padding: 1px 6px;
        border: 1px solid var(--a-rule-2);
        border-radius: 4px;
        font: 10px var(--font-mono);
        color: var(--a-ink-3);
      }

      .dir-atelier .a-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 14px;
        min-height: 0;
      }
      .dir-atelier .a-panel {
        background: var(--a-canvas);
        border: 1px solid var(--a-rule);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .dir-atelier .a-panel-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--a-rule);
        background: var(--a-canvas);
      }
      .dir-atelier .a-panel-h h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dir-atelier .a-panel-h .meta {
        font-size: 11px;
        color: var(--a-ink-3);
        font-family: var(--font-mono);
      }
      .dir-atelier .a-tag {
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .dir-atelier .a-tag--lime {
        background: rgba(196, 242, 90, 0.16);
        color: var(--a-accent);
      }
      .dir-atelier .a-tag--good {
        background: rgba(110, 215, 154, 0.16);
        color: var(--a-good);
      }
      .dir-atelier .a-tag--warn {
        background: rgba(242, 185, 77, 0.16);
        color: var(--a-warn);
      }
      .dir-atelier .a-tag--bad {
        background: rgba(239, 111, 111, 0.16);
        color: var(--a-bad);
      }
      .dir-atelier .a-tag--mute {
        background: var(--a-surface-2);
        color: var(--a-ink-2);
      }

      .dir-atelier table.a-tbl {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 12px;
      }
      .dir-atelier table.a-tbl th {
        text-align: left;
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--a-ink-3);
        padding: 8px 14px;
        background: var(--a-canvas);
        border-bottom: 1px solid var(--a-rule);
        position: sticky;
        top: 0;
      }
      .dir-atelier table.a-tbl td {
        padding: 9px 14px;
        border-bottom: 1px solid var(--a-rule);
        vertical-align: middle;
      }
      .dir-atelier table.a-tbl tr:hover td {
        background: var(--a-surface);
      }
      .dir-atelier table.a-tbl .num {
        font-family: var(--font-mono);
        text-align: right;
      }
      .dir-atelier table.a-tbl .who {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dir-atelier table.a-tbl .ico {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        background: var(--a-surface-2);
        color: var(--a-ink-2);
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 600;
      }
      .dir-atelier .a-staffrow .name {
        font-weight: 500;
        color: var(--a-ink);
      }
      .dir-atelier .a-staffrow .sub {
        font-size: 10px;
        color: var(--a-ink-3);
        margin-top: 1px;
      }

      /* tonight visual: timeline */
      .dir-atelier .a-timeline {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
