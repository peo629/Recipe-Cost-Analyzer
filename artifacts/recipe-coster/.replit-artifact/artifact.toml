kind = "web"
previewPath = "/"
title = "Recipe Coster"
version = "1.0.0"
id = "artifacts/recipe-coster"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19843

[services.development]
run = "pnpm --filter @workspace/recipe-coster run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/recipe-coster", "run", "build" ]
publicDir = "artifacts/recipe-coster/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19843"
BASE_PATH = "/"
